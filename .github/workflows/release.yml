# Pushing a tag vX.Y.Z builds the installers for Windows, Mac and Linux and a
# signed Android APK, and publishes them as a GitHub Release with stable file
# names, so releases/latest/download/<name> always points at the newest one.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}
  VITE_MS_TENANT: ${{ vars.VITE_MS_TENANT || 'common' }}
  VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/Planora-Setup-*.exe
            release/Planora-*-portable.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: release/Planora-*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: release/Planora-*.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_B64 is missing"; exit 1; fi
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/planora.p12"
      - name: Build signed APK
        working-directory: android
        env:
          PLANORA_KEYSTORE: ${{ runner.temp }}/planora.p12
          PLANORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLANORA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Check signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then echo "::error::No signed APK was built"; exit 1; fi
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          mv "$apk" Planora.apk
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/planora.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: Planora.apk

  publish:
    needs: [windows, mac, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Give the files stable names
        working-directory: out
        run: |
          mv Planora-Setup-*.exe Planora-Setup.exe
          mv Planora-*-portable.exe Planora-portable.exe
          mv Planora-*-arm64.dmg Planora-Mac-AppleSilicon.dmg
          mv Planora-*-x64.dmg Planora-Mac-Intel.dmg
          mv Planora-*.AppImage Planora.AppImage
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*
